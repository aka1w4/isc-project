<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://unpkg.com/tailwindcss@1.9.6/dist/tailwind.min.css" rel="stylesheet">  
  <title>Kampus</title>
</head>
<body>
    <h1 class="text-2xl font-bold text-gray-800 mb-6">
      Data Mahasiswa Kelas: 01TPLP000
    </h1>
    <div class="overflow-x-auto">
      <table class="w-full border-collapse text-left">
        <thead>
          <tr class="bg-blue-600 text-white">
            <th class="px-6 py-3 border border-gray-300">Nomor</th>
            <th class="px-6 py-3 border border-gray-300">Nim</th>
            <th class="px-6 py-3 border border-gray-300">Nama</th>
          </tr>
        </thead>
        <tbody id="hasil" class="text-gray-700">
        </tbody>
      </table>
    </div>
    <button
      type="button"
      class="mt-5 bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded-lg transition duration-200">
      <a href="./create_absen">Create Absen</a>
    </button>
  <script>
    fetch("http://localhost:3030/api/mahasiswa")
      .then(response => response.json())
      .then(data => {

        let html = "";
        let nomor = 1;
        
        data.forEach(user => {
          html += `
            <tr class="hover:bg-gray-100 transition">
              <td class="px-6 py-3 border border-gray-300">${nomor}</td>
              <td class="px-6 py-3 border border-gray-300">${user.nim}</td>
              <td class="px-6 py-3 border border-gray-300">${user.nama}</td>
            </tr>
          `;
          nomor++;
        });

        document.getElementById("hasil").innerHTML = html;
      });
  </script>
</body>
</html>
