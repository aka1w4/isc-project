<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://unpkg.com/tailwindcss@1.9.6/dist/tailwind.min.css" rel="stylesheet">  
  <title>Kampus</title>
</head>
<body>
    <h1 class="text-2xl font-bold text-gray-800 mb-6">
      Data absen mahasiswa Kelas: 01TPLP000
    </h1>
    <div class="overflow-x-auto">
      <table class="w-full border-collapse text-left">
        <thead>
          <tr class="bg-blue-600 text-white">
            <th class="px-6 py-3 border border-gray-300">Nim</th>
            <th class="px-6 py-3 border border-gray-300">Nama</th>
            <th class="px-6 py-3 border border-gray-300">Status</th>
          </tr>
        </thead>
        <tbody id="hasilAbsen" class="text-gray-700">
        </tbody>
      </table>
    </div>
    <div id="hasilTanggal"></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    
    fetch(`http://localhost:3030/api/absen/${id}`)
      .then(response => response.json())
      .then(data => {

        let htmlAbsen = "";
        let htmlTanggal = "";
        data.forEach(absen => {
          htmlTanggal += `
            <h2 class="text-2xl text-gray-800 mb-6">
              ${absen.tanggal_absen}
            </h2>
            `;

          absen.data.forEach(mahasiswa => {
          htmlAbsen += `
            <tr class="hover:bg-gray-100 transition">
                <td class="px-6 py-3 border border-gray-300">
                    ${mahasiswa.nim}
                </td>
                <td class="px-6 py-3 border border-gray-300">
                    ${mahasiswa.nama}
                </td>
                <td class="px-6 py-3 border border-gray-300">
                    ${mahasiswa.status}
                </td>
            </tr>
              `;
          });
        });

        document.getElementById("hasilAbsen").innerHTML = htmlAbsen;
        document.getElementById("hasilTanggal").innerHTML = htmlTanggal;
      });
  </script>
</body>
</html>
